# Runs the automated tests on clean Windows and macOS machines for every push and pull request,
# so a broken change shows a red X on GitHub before teammates pull it.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exactly what requirements.txt lists
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python tests/test_classeye.py
